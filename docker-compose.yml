# Postgres local para desenvolvimento: `docker compose up -d`
# Credenciais iguais às do .env.example (apenas para uso local).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gatcha
      POSTGRES_PASSWORD: gatcha_dev
      POSTGRES_DB: gatcha
    ports:
      - "127.0.0.1:5433:5432"   # 5433 no seu PC: a 5432 costuma estar ocupada/bloqueada no Windows
    volumes:
      - gatcha-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatcha"]
      interval: 5s
      retries: 10

volumes:
  gatcha-pg:
