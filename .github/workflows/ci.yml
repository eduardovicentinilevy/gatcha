name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gatcha
          POSTGRES_PASSWORD: gatcha_ci
          POSTGRES_DB: gatcha_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gatcha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://gatcha:gatcha_ci@localhost:5432/gatcha_test
